<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>Copa Student Portal</title>
<script>try{ if (localStorage.getItem('copa_theme') === 'light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}</script>
<style>
:root{--bg:#0f1623;--s1:#1a2236;--s2:#212d44;--bd:#2d3f5e;--acc:#3b82f6;--g:#22c55e;--r:#ef4444;--y:#f59e0b;
--tx:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--B:#8b5cf6;--C:#06b6d4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100%;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.hdr b{font-size:16px}.hdr small{display:block;font-size:11px;color:var(--t2)}
.sc{display:none;padding:16px;max-width:640px;margin:0 auto}.sc.on{display:block}
h1{font-size:26px;text-align:center;margin-top:24px}.sub{text-align:center;color:var(--t2);font-size:14px;margin:6px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{background:var(--s1);border:2px solid var(--bd);border-radius:16px;padding:26px 12px;text-align:center;cursor:pointer}
.role:active{transform:scale(.97)}.role span{font-size:34px;display:block}.role b{display:block;margin-top:8px}.role small{color:var(--t2);font-size:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--t2);margin:0 0 4px}
input,select,textarea{width:100%;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.f{margin-bottom:11px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:11px;color:var(--y);margin-top:3px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;background:var(--s2);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.6}
.seg,.tabs{display:flex;gap:4px;background:var(--s1);padding:5px;border-radius:14px;margin-bottom:14px}
.seg button,.tabs button{flex:1;padding:9px 4px;border:0;background:none;color:var(--t2);font-weight:700;font-size:13px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.seg button.on.B{background:var(--B);color:#fff}.seg button.on.C{background:var(--C);color:#fff}
.sec{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--t3);text-transform:uppercase;margin:14px 0 8px}
.rc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rc b{font-size:14px}.rc div{font-size:12px;color:var(--t2);margin-top:3px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
.tag.B{background:rgba(139,92,246,.2);color:var(--B)}.tag.C{background:rgba(6,182,212,.2);color:var(--C)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{text-align:center;margin:0}
.st b{font-size:26px;display:block}.st small{font-size:11px;color:var(--t2)}
.bar{height:4px;background:var(--s2);border-radius:2px;margin-top:5px}.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center}
.d{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.d div{background:var(--s2);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;word-break:break-word}
.d small{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:600}.d .w{grid-column:1/-1}
.ban{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--y);border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px}
.empty{text-align:center;color:var(--t3);padding:26px;font-size:14px}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);background:var(--s1);border:1px solid var(--bd);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;transition:.3s;z-index:99;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}#toast.ok{border-color:var(--g);color:var(--g)}#toast.err{border-color:var(--r);color:var(--r)}
.pv{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.35);color:#93c5fd;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.6}
.pv b{color:#fff}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
.tw table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.tw th{background:var(--s2);color:var(--t2);text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase}
.tw td{padding:8px 10px;border-top:1px solid var(--bd)}
.tw tr.nx td{background:rgba(59,130,246,.12);color:#93c5fd;font-weight:700}
@media(max-width:420px){.tabs button{font-size:11px;padding:9px 1px}}
a.lnk{color:#60a5fa;font-size:13px;cursor:pointer;display:block;text-align:center;margin-top:14px}
/* ☀️ Day mode */
:root[data-theme="light"]{--bg:#f1f5f9;--s1:#ffffff;--s2:#e8eef6;--bd:#cbd5e1;--acc:#2563eb;--g:#16a34a;--r:#dc2626;--y:#b45309;
--tx:#0f172a;--t2:#475569;--t3:#64748b;--B:#7c3aed;--C:#0891b2}
:root[data-theme="light"] .pv{color:#1d4ed8}
:root[data-theme="light"] .pv b{color:#0f172a}
:root[data-theme="light"] .tw tr.nx td{color:#1d4ed8}
:root[data-theme="light"] a.lnk{color:#2563eb}
#themeBtn{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:5px 10px;font-size:14px;line-height:1;cursor:pointer}
</style>

<body>
<div class="hdr"><div onclick="secretTap()"><b>🎓 Copa Student Portal</b><small id="sub">ITI Admission 2026</small></div><span style="display:flex;align-items:center;gap:8px"><button id="themeBtn" onclick="toggleTheme()" aria-label="Day / Night mode"></button><span id="who" style="font-size:12px;color:var(--t2)"></span></span></div>
<div id="toast"></div>

<!-- HOME -->
<div class="sc on" id="app">
  <div id="conn"></div>
  <div class="tabs" id="tabs">
    <button class="on" onclick="tab(0)">🔍 Search</button><button onclick="tab(1)">➕ Entry / Edit</button><button onclick="tab(2)">📊 Stats</button><button onclick="tab(3)">📋 Sheet</button>
  </div>
  <div class="seg" id="copaSeg" style="display:none">
    <button data-c="B" onclick="setCopa('B')">Copa B</button><button data-c="C" onclick="setCopa('C')">Copa C</button>
  </div>

  <div id="t0">
    <div class="f"><input id="q1" placeholder="🔍 Naam, Father, Mobile, DOB, Reg No…" oninput="renderSearch()"></div>
    <div id="slist"></div><div id="sdet" style="display:none"></div>
  </div>

  <div id="t1" style="display:none">
    <div class="ban" id="editBan" style="display:none"></div>
    <div class="pv" id="pv"></div>
    <div class="row" style="margin-bottom:8px"><span id="snoBar" style="font-size:12px;color:var(--t3)"></span></div>
    <div id="form"></div>
    <button class="btn p" id="saveBtn" onclick="save()">📤 Save Entry</button>
    <button class="btn" onclick="resetForm()">🔄 Clear / Naya</button>
    <datalist id="cats"></datalist>
  </div>

  <div id="t2" style="display:none"><div class="st" id="stats"></div><div class="sec">Category-wise</div><div id="cat"></div></div>

  <div id="t3" style="display:none"><div id="sheet"></div></div>

  <button class="btn" onclick="loadAll()">🔄 Refresh Data</button>
  <a class="lnk" id="setupLink" style="display:none" onclick="toggleSetup()">⚙️ Settings (Script URL)</a>
  <div class="card" id="setupCard" style="display:none;margin-top:14px">
    <div class="f"><label>Copa B Web App URL</label><input id="uB" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="f"><label>Copa C Web App URL</label><input id="uC" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <button class="btn p" onclick="saveUrls()">Save & Reload</button>
  </div>
</div>

<script>
// ═══ CONFIG: dono Web App URLs (localStorage se ⚙️ Settings me bhi badal sakte hain) ═══
const SCRIPT_URLS = {
  B: 'https://script.google.com/macros/s/AKfycbx85gJB9BfMrpsQRaZYZhG2OZsBbAFrjE5kZxskMB9fvIKSkByIzi0J-UP3LpJAE8GZng/exec',
  C: 'https://script.google.com/macros/s/AKfycbzGqCB_crfS1YL58lZ-wANRwrogr19aTs_yOzu7MosfSBdZRngd3XlhNCQVxTppZXh1hg/exec'
};
const ADMIN_PIN = '1234';  // sirf naya (v3) script maangta hai; purana script use nahi karta

const FIELDS = [
  ['reg','Registration No. *','text'],['name','Student Name *','text'],['father',"Father's Name *",'text'],
  ['gender','Gender *','sel',['Male','Female','Other']],['dob','Date of Birth *','date'],
  ['merit','Merit %','number'],['category','Category *','cat'],['aadhaar','Aadhaar','text'],['mobile','Mobile *','tel'],
  ['adm','Date of Admission','date'],['paid','Fees Paid?','sel',['Yes','No']],['address','Address','area']
];
const COLS = ['sno','reg','name','father','gender','dob','merit','aadhaar','mobile','category','adm','paid','address'];
const DEF_CATS = ['General','Scheduled Caste','Backward Class-A','Backward Class-B','Deprived Scheduled'];

let copa = 'B', data = {B:[],C:[]}, next = {B:{},C:{}}, edit = null, timer, forceSetup = false, dirty = false, sugReg = '', shownSno = null, loading = false, retryT;
const mode = {}, cache = {};
const $ = id => document.getElementById(id);
function toggleTheme(){
  const light = document.documentElement.getAttribute('data-theme') !== 'light';
  if (light) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('copa_theme', light ? 'light' : 'dark'); } catch(e){}
  $('themeBtn').textContent = light ? '🌙' : '☀️';
}
$('themeBtn').textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
const S = v => String(v ?? '').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

// ── date helpers ──
function isoDate(s){
  s = S(s); if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { const d = new Date(s); if (!isNaN(d)) return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  return s;
}
// Google Sheet ke format me data likhne ke liye: naam/reg CAPITAL, dates dd/mm/yyyy, mobile sirf digits
function sheetFmt(d){
  const up = v => S(v).replace(/\s+/g,' ').toUpperCase();
  return {...d, reg: S(d.reg).toUpperCase(), name: up(d.name), father: up(d.father),
    dob: showDate(isoDate(d.dob)), adm: showDate(isoDate(d.adm)), mobile: S(d.mobile).replace(/\D/g,'')};
}
function showDate(s){ const m = S(s).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : S(s); }

// ── URLs ──
function cleanUrl(v){ v = S(v); const m = v.match(/https:\/\/script\.google\.com\/(?:a\/[^\/]+\/)?macros\/s\/[\w-]+/); return m ? m[0] + '/exec' : v; }
function url(c){ let s=''; try{ s = localStorage.getItem('copa_url_'+c) || ''; }catch(e){} return cleanUrl(s) || cleanUrl(SCRIPT_URLS[c]) || ''; }
const fails = {B:0, C:0}, fresh = {B:false, C:false};
let bad = 0, taps = 0, tapT;
function secretTap(){ taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 2000); if (taps >= 5){ taps = 0; toggleSetup(); } }
function saveCache(){ try { const st = a => a.map(r => Object.assign({}, r, {aadhaar:''}));
  localStorage.setItem('copa_cache_v1', JSON.stringify({B:{d:st(data.B),n:next.B}, C:{d:st(data.C),n:next.C}})); } catch(e){} }
function saveUrls(){
  for (const c of ['B','C']){ const v = $('u'+c).value.trim(); if (v){ try{ localStorage.setItem('copa_url_'+c, v); }catch(e){} } delete mode[c]; delete cache[c]; }
  toast('Save ho gaya','ok'); forceSetup = false; checkSetup(); loadAll();
}
function autoSaveUrls(){
  let ch = false;
  for (const c of ['B','C']){ const v = $('u'+c).value.trim(); if (/^https:\/\//.test(v) && v !== url(c)){ try{ localStorage.setItem('copa_url_'+c, v); }catch(e){} delete mode[c]; delete cache[c]; ch = true; } }
  if (ch){ toast('URL save ho gaya — apne aap connect ho raha hai','ok'); loadAll(); }
}
['uB','uC'].forEach(id => $(id).addEventListener('input', () => { clearTimeout(autoSaveUrls.t); autoSaveUrls.t = setTimeout(autoSaveUrls, 1500); }));
function toggleSetup(){ forceSetup = !forceSetup; checkSetup();  }
function checkSetup(){
  const need = forceSetup || bad >= 3 || !(url('B') && url('C'));
  $('setupCard').style.display = need ? 'block' : 'none';
  $('setupLink').style.display = need ? 'block' : 'none';
  if (need){ if (document.activeElement !== $('uB')) $('uB').value = url('B'); if (document.activeElement !== $('uC')) $('uC').value = url('C'); }
}

// ── network (text/plain body → CORS preflight nahi hota) ──
// Apps Script kabhi-kabhi cold-start/temporary error deta hai — padhne wali (safe) requests apne aap 3 baar tak dobara try hoti hain.
// Save/append wali request kabhi auto-retry nahi hoti (duplicate entry na bane).
async function http(u, opt, tries){
  const max = tries || (opt ? 1 : 3); let last;
  for (let a = 0; a < max; a++){
    try { return await http1(u, opt); }
    catch(e){ last = e; if (a < max-1) await new Promise(res => setTimeout(res, 900*(a+1))); }
  }
  throw last;
}
async function http1(u, opt){
  let r, t;
  if (!opt) u += (u.includes('?') ? '&' : '?') + '_=' + Date.now();
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 30000);
  const NET = 'Server se connect nahi ho paya — internet aur Script URL check karein. App ko Chrome/browser me kholein (Claude preview me network band rehta hai).';
  try { r = await fetch(u, Object.assign({}, opt || {}, {signal: ac.signal})); t = await r.text(); }
  catch(e){ throw new Error(NET + (ac.signal.aborted ? ' (time out)' : ' [' + ((e && e.message) || e) + ']')); }
  finally { clearTimeout(tm); }
  try { return JSON.parse(t); }
  catch(e){
    if (/<html|accounts\.google|sign.?in/i.test(t)) throw new Error('Script login maang raha hai — Apps Script → Deploy → Manage deployments me "Who has access: Anyone" rakhein.');
    throw new Error('Script ne sahi jawab nahi diya (HTTP ' + r.status + ') — latest version deploy karein aur "Who has access: Anyone" rakhein.');
  }
}
const qs = (u, q) => u + (u.includes('?') ? '&' : '?') + q;

// ── purana (v2) script ka data → objects ──
const rowObj = (a, i) => { const o = {row: i+4}; COLS.forEach((k,x) => o[k] = S(a[x])); o.dob = isoDate(o.dob); o.adm = isoDate(o.adm); return o; };
function bumpReg(s){
  const m = S(s).match(/^(.*?)(\d+)$/); if (!m) return '';
  return m[1] + (BigInt(m[2]) + 1n).toString().padStart(m[2].length, '0');
}
function calcNext(rows){
  const snos = rows.map(r => parseInt(r.sno)).filter(n => !isNaN(n));
  const last = rows[rows.length-1] || {};
  return {sno: snos.length ? Math.max(...snos)+1 : 1, reg: bumpReg(last.reg), adm: last.adm || '', category: last.category || ''};
}
async function readV2(c, fresh){
  if (!fresh && cache[c] && Date.now()-cache[c].t < 20000) return cache[c].rows;
  const j = await http(qs(url(c), 'action=read'));
  if (j.status !== 'ok') throw new Error(j.message || 'Read error');
  const rows = (j.data || []).map(rowObj).filter(r => r.name || r.reg);
  cache[c] = {t: Date.now(), rows};
  return rows;
}

// script ka type pehchano: purana (v2: GET read + append/update) ya naya (v3: PIN + list/save/lookup)
async function detect(c){
  if (!mode[c]){ try { mode[c] = localStorage.getItem('copa_mode_'+c) || undefined; } catch(e){} }
  if (mode[c]) return mode[c];
  const u = url(c); if (!u) throw new Error('Copa '+c+' ka script URL set nahi hai (⚙️ Settings)');
  let m = 'v3', sure = false;
  try {
    const j = await http(qs(u,'action=read'));
    if (j.status === 'ok' && Array.isArray(j.data) && (!j.data.length || Array.isArray(j.data[0]))){
      m = 'v2'; cache[c] = {t: Date.now(), rows: (j.data || []).map(rowObj).filter(r => r.name || r.reg)};
    }
    sure = true;
  } catch(e){ if (/connect nahi/.test(e.message)) throw e; }
  if (!sure) return m;   // jawab saaf nahi mila (temporary glitch) — mode yaad mat karo, agli baar dobara pehchano
  try { localStorage.setItem('copa_mode_'+c, m); } catch(e){}
  return mode[c] = m;
}

async function api(c, body){
  const m = await detect(c);
  if (m === 'v3'){
    const j = await http(url(c), {method:'POST', body: JSON.stringify(body)}, (body.action === 'list' || body.action === 'lookup') ? 3 : 1);
    if (j.status !== 'ok') throw new Error(j.message || 'Error');
    if (j.copa && j.copa !== c) throw new Error('Copa '+c+' ke slot mein Copa '+j.copa+' ka script laga hai — URL/script check karein');
    if (Array.isArray(j.data)) j.data.forEach(r => { r.dob = isoDate(r.dob); r.adm = isoDate(r.adm); });
    return j;
  }
  // ── v2 adapter ──
  if (body.action === 'list'){
    const rows = await readV2(c, !(cache[c] && Date.now()-cache[c].t < 4000));
    return {status:'ok', data: rows, next: calcNext(rows)};
  }
  if (body.action === 'lookup'){
    const rows = await readV2(c);
    const q = S(body.q).toLowerCase(), qd = q.replace(/\D/g,''), qdob = isoDate(q);
    const hit = rows.filter(r => r.name.toLowerCase().includes(q) || r.father.toLowerCase().includes(q)
      || (qd.length >= 4 && r.mobile.includes(qd)) || (/^\d{4}-\d{2}-\d{2}$/.test(qdob) && r.dob === qdob));
    return {status:'ok', data: hit.slice(0,30).map(r => {
      const dg = r.aadhaar.replace(/\D/g,'');
      return {...r, aadhaar: dg ? 'XXXX XXXX '+dg.slice(-4) : ''};
    })};
  }
  if (body.action === 'save'){
    const d = body.data; let sno = body.sno;
    if (!body.row){
      const rows = await readV2(c, !(cache[c] && Date.now()-cache[c].t < 4000));
      const dup = rows.find(r => r.reg && r.reg.toLowerCase() === d.reg.toLowerCase());
      if (dup) throw new Error('Ye Registration No. pehle se hai — S.No. '+dup.sno+' ('+dup.name+')');
      sno = calcNext(rows).sno;
    }
    const payload = {action: body.row ? 'update' : 'append', copa: c, rowIndex: body.row || null, sno,
      data: {regNo:d.reg, name:d.name, father:d.father, gender:d.gender, dob:d.dob, merit:d.merit, aadhaar:d.aadhaar,
             mobile:d.mobile, category:d.category, admDate:d.adm, isPaid:d.paid, address:d.address}};
    const j = await http(url(c), {method:'POST', body: JSON.stringify(payload)});
    if (j.status !== 'ok') throw new Error(j.message || 'Save error');
    delete cache[c];
    return {status:'ok', sno};
  }
  throw new Error('Unknown action');
}

// ── navigation ──
function tab(n){
  [0,1,2,3].forEach(i => { $('t'+i).style.display = i===n ? 'block' : 'none'; $('tabs').children[i].classList.toggle('on', i===n); });
  $('copaSeg').style.display = n===0 ? 'none' : 'flex';
  if (n===0) renderSearch(); if (n===2) renderStats(); if (n===3) renderSheet(); if (n===1) updatePreview();
}

// ── DATA: dono Copa ka data ek saath ──
async function loadAll(silent){
  if (silent === true && loading) return;
  loading = true; clearTimeout(retryT);
  const box = $('conn');
  if (silent !== true) box.innerHTML = '<div class="empty" style="padding:10px">Data load ho raha hai…</div>';
  const res = await Promise.allSettled(['B','C'].map(c => { delete cache[c]; return api(c,{action:'list',pin:ADMIN_PIN}).then(v => {
    fresh[c] = true; data[c] = v.data || []; next[c] = v.next || {}; saveCache(); refreshAll(); return v; }); }));
  const out = [];
  res.forEach((r,i) => {
    const c = 'BC'[i];
    if (r.status === 'fulfilled'){ fails[c] = 0; data[c] = r.value.data || []; next[c] = r.value.next || {}; out.push(['ok', `Copa ${c}: ✅ ${data[c].length} students`]); }
    else {
      out.push(fresh[c] ? ['warn', `Copa ${c}: ⏳ Dobara connect ho raha hai… (pichla data dikh raha hai)`] : ['err', `Copa ${c}: ❌ ${r.reason.message}`]);
      fails[c]++;
      if (fails[c] >= 2){ delete mode[c]; try { localStorage.removeItem('copa_mode_'+c); } catch(e){} }
      try { const ls = localStorage.getItem('copa_url_'+c);
        if (fails[c] >= 3 && ls && SCRIPT_URLS[c] && cleanUrl(ls) !== cleanUrl(SCRIPT_URLS[c])){ localStorage.removeItem('copa_url_'+c); delete mode[c]; delete cache[c]; fails[c] = 0; $('u'+c).value = url(c); }
      } catch(e){}
    }
  });
  box.innerHTML = out.map(([t,m]) => `<div style="font-size:12px;margin-bottom:6px;color:var(--${t==='ok'?'g':t==='warn'?'y':'r'})">${esc(m)}</div>`).join('')
    + (out.some(o=>o[0]==='err') ? '<button class="btn p" onclick="loadAll()">🔄 Dobara koshish karein</button>' : '');
  loading = false;
  bad = out.some(o=>o[0]==='err') ? bad+1 : 0; checkSetup();   // 'err' = jis Copa ka data kabhi aaya hi nahi
  refreshAll();
  // koi bhi script connect na ho paya to apne aap dobara koshish (kisi ko button nahi dabana)
  if (out.some(o=>o[0]!=='ok')) retryT = setTimeout(() => loadAll(true), 2000);
}
async function reload(){
  try { const j = await api(copa,{action:'list',pin:ADMIN_PIN}); data[copa]=j.data||[]; next[copa]=j.next||{}; refreshAll(); toast('✅ '+data[copa].length+' records','ok'); }
  catch(e){ toast(e.message,'err'); }
}
function setCopa(c){
  copa = c; shownSno = null; [...$('copaSeg').children].forEach(b => b.className = b.dataset.c===c ? 'on '+c : '');
  resetForm(); refreshAll();
}
function refreshAll(){
  const cats = [...new Set([...DEF_CATS, ...data[copa].map(r=>r.category).filter(Boolean)])];
  $('cats').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
  renderStats(); renderSheet(); if (!edit && !dirty) autoFill(); else updatePreview();
  if ($('sdet').style.display === 'none') renderSearch();
}

// form
function buildForm(){
  $('form').setAttribute('autocomplete','off');
  $('form').innerHTML = FIELDS.map(([k,l,t,o]) => {
    let inp;
    if (t==='sel') inp = `<select id="f_${k}"><option value="">-- Select --</option>${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
    else if (t==='area') inp = `<textarea id="f_${k}" rows="3" autocomplete="off"></textarea>`;
    else if (t==='cat') inp = `<input id="f_${k}" list="cats" placeholder="Select ya likhein" autocomplete="off">`;
    else inp = `<input id="f_${k}" type="${t}" autocomplete="off" ${k==='mobile'?'maxlength="10" inputmode="numeric"':''} ${t==='number'?'step="0.01" min="0" max="100"':''}>`;
    return `<div class="f"><label>${l}</label>${inp}${k==='reg'?'<div class="hint" id="regHint"></div>':''}</div>`;
  }).join('');
}
const val = k => $('f_'+k).value.trim();
$('form').addEventListener('input', () => { dirty = true; });

// sheet me next row (naya student yahin judega)
function nextRow(){
  const n = next[copa] || {}; if (n.row) return n.row;
  const rs = data[copa].map(r => +r.row).filter(x => x > 0);
  return rs.length ? Math.max(...rs) + 1 : 4;
}
function updatePreview(){
  const el = $('pv'), n = next[copa] || {};
  if (edit){ el.innerHTML = `✏️ <b>Copa ${copa}</b> — S.No. <b>${esc(edit.sno)}</b> · Sheet Row <b>${esc(edit.row)}</b> mein yahi student edit hoga`; return; }
  if (!n.sno){ el.innerHTML = '⏳ Sheet se next S.No. detect ho raha hai…'; return; }
  if (shownSno && n.sno !== shownSno && dirty && $('t1').style.display !== 'none')
    toast('⚠️ Kisi aur ne entry kar di — aapka naya S.No. '+n.sno+' (Row '+nextRow()+') hai','err');
  shownSno = n.sno;
  if (sugReg && dirty && n.reg && $('f_reg') && $('f_reg').value.trim() === sugReg && n.reg !== sugReg){ $('f_reg').value = n.reg; sugReg = n.reg; }
  const a = data[copa], last = a[a.length-1];
  el.innerHTML = `🆕 <b>Copa ${copa}</b> — aapki entry Sheet ki Row <b>${esc(nextRow())}</b>, S.No. <b>${esc(n.sno)}</b> mein add hogi`;
}
function renderSheet(){
  const a = data[copa], n = next[copa] || {};
  if (!a.length && !n.sno){ $('sheet').innerHTML = '<div class="empty">Data load ho raha hai…</div>'; return; }
  const rows = a.map(r => `<tr><td>${esc(r.sno)}</td><td>${esc(r.row||'—')}</td><td>${esc(r.reg)}</td><td>${esc(r.name)}</td><td>${esc(r.father)}</td><td>${esc(r.gender)}</td><td>${esc(showDate(r.dob))}</td><td>${esc(r.category)}</td><td>${esc(r.mobile)}</td><td>${r.paid==='Yes'?'✅':'❌'}</td></tr>`).join('');
  $('sheet').innerHTML = `<div class="sec">Copa ${copa} — ${a.length} students · 🟢 Live</div>
    <div class="tw"><table><thead><tr><th>S.No.</th><th>Row</th><th>Reg No.</th><th>Name</th><th>Father</th><th>Gender</th><th>DOB</th><th>Category</th><th>Mobile</th><th>Fees</th></tr></thead><tbody>${rows}
    ${n.sno ? `<tr class="nx"><td>${esc(n.sno)}</td><td>${esc(nextRow())}</td><td colspan="8">⬅ Agli entry yahan judegi (khaali)</td></tr>` : ''}</tbody></table></div>`;
}

function autoFill(){
  const n = next[copa] || {};
  $('snoBar').textContent = 'Next S.No.: ' + (n.sno || '—');
  updatePreview();
}
function resetForm(){
  edit = null; dirty = false; buildForm(); $('editBan').style.display='none'; $('saveBtn').textContent='📤 Save Entry';
  if (data[copa].length || next[copa]?.sno) autoFill(); else updatePreview();
}
function validate(d){
  if (!d.reg) return 'Registration No. daalein'; if (!d.name) return 'Student Name daalein';
  if (!d.father) return "Father's Name daalein"; if (!d.gender) return 'Gender chunein';
  if (!d.dob) return 'Date of Birth daalein'; if (!/^\d{10}$/.test(d.mobile)) return 'Valid 10-digit mobile daalein';
  if (!d.category) return 'Category daalein'; return null;
}
async function save(){
  const d = {}; FIELDS.forEach(([k]) => d[k] = val(k));
  const err = validate(d); if (err) return toast(err,'err');
  const b = $('saveBtn'); b.disabled = true; b.textContent = 'Saving…';
  if (edit && !fresh[copa]) return toast('Sheet se data update ho raha hai — 1-2 second baad dobara save karein','err');
  const wasEdit = !!edit; dirty = true;
  try {
    if (!wasEdit){
      // save se pehle taaza sheet dekho — agar kisi aur ne beech me entry kar di to naya S.No./Row dikhao
      const f = await api(copa,{action:'list',pin:ADMIN_PIN}), old = shownSno;
      data[copa] = f.data || []; next[copa] = f.next || {};
      if (old && next[copa].sno !== old){ refreshAll(); b.disabled = false; b.textContent = '📤 Save Entry'; return; }
    }
    const pvRow = wasEdit ? edit.row : nextRow();
    const j = await api(copa,{action:'save',pin:ADMIN_PIN,row:edit?.row,sno:edit?.sno,data:sheetFmt(d)});
    toast((wasEdit?'✏️ Update ho gaya':'✅ Save ho gaya')+' — S.No. '+j.sno+' · Row '+(j.row||pvRow),'ok');
    edit = null; await reload(); resetForm(); if (wasEdit){ tab(0); renderSearch(); }
  } catch(e){ toast(e.message,'err'); b.textContent = wasEdit ? '💾 Update Entry' : '📤 Save Entry'; }
  b.disabled = false;
}
function loadEdit(i){
  if (!fresh[copa]) return toast('Sheet se data update ho raha hai — 1-2 second baad dobara try karein','err');
  const r = data[copa][i]; if (!r) return; edit = {row:r.row, sno:r.sno};
  buildForm();
  FIELDS.forEach(([k,,t]) => $('f_'+k).value = t==='date' ? isoDate(r[k]) : (r[k] ?? ''));
  $('regHint').textContent=''; $('snoBar').textContent = 'Editing S.No.: '+r.sno;
  $('editBan').style.display='block'; $('editBan').textContent = `✏️ Edit mode — S.No. ${r.sno} · Sheet Row ${r.row} (${r.name})`;
  $('saveBtn').textContent='💾 Update Entry'; dirty = false; updatePreview(); tab(1); scrollTo({top:0,behavior:'smooth'});
}
function renderStats(){
  const a = data[copa], t = a.length, p = a.filter(r=>r.paid==='Yes').length;
  const m = a.filter(r=>r.gender==='Male').length, f = a.filter(r=>r.gender==='Female').length;
  $('stats').innerHTML = `<div class="card"><b>${t}</b><small>Total Students</small></div><div class="card"><b style="color:var(--g)">${p}</b><small>Fees Paid</small></div>
    <div class="card"><b style="color:var(--r)">${t-p}</b><small>Fees Pending</small></div><div class="card"><b style="color:var(--y)">${m}/${f}</b><small>Male / Female</small></div>`;
  const c = {}; a.forEach(r => { const k = r.category || 'Unknown'; c[k] = (c[k]||0)+1; });
  $('cat').innerHTML = Object.entries(c).sort((x,y)=>y[1]-x[1]).map(([k,n]) =>
    `<div class="card" style="padding:10px 12px"><div class="row"><span style="font-size:13px">${esc(k)}</span><b>${n}</b></div><div class="bar"><i style="width:${Math.round(n/t*100)}%"></i></div></div>`).join('') || '<div class="empty">Data nahi hai</div>';
}


// ── SEARCH (sabke liye ek jagah: Copa B + C dono) ──
function renderSearch(){
  $('sdet').style.display = 'none'; $('slist').style.display = 'block';
  const q = $('q1').value.trim().toLowerCase(), qd = q.replace(/\D/g,'');
  const out = $('slist');
  if (!q){ out.innerHTML = '<div class="empty">🔎 Apna <b>naam</b>, <b>father ka naam</b>, <b>mobile</b> ya <b>DOB (dd/mm/yyyy)</b> likhein.<br>Same naam wale sabhi dikhenge — apna chun lein.</div>'; window._hits = []; return; }
  if (!data.B.length && !data.C.length){ out.innerHTML = '<div class="empty">Data load ho raha hai — apne aap connect ho jayega…</div>'; window._hits = []; return; }
  const hits = [];
  ['B','C'].forEach(c => data[c].forEach((r,i) => {
    if ([r.name,r.father,r.reg,r.dob,showDate(r.dob)].some(x => S(x).toLowerCase().includes(q)) || (qd.length>=3 && S(r.mobile).includes(qd))) hits.push({c,i});
  }));
  window._hits = hits;
  out.innerHTML = hits.length ? hits.slice(0,80).map(({c,i},k) => { const r = data[c][i]; return `
    <div class="rc" onclick="showDetail(${k})"><b>${esc(r.name)}<span class="tag ${c}">Copa ${c}</span></b>
    <div>👨 ${esc(r.father)} · 📱 ${esc(r.mobile)}</div>
    <div>🎂 ${esc(showDate(r.dob)||'—')} · S.No. ${esc(r.sno)} · ${esc(r.category)} · <span class="dot" style="background:var(${r.paid==='Yes'?'--g':'--r'})"></span>${esc(r.paid||'—')}</div></div>`; }).join('')
    : '<div class="empty">Koi record nahi mila 😔</div>';
}
function showDetail(k){
  const {c,i} = window._hits[k], r = data[c][i], paid = r.paid==='Yes';
  const it = (l,v,w) => `<div class="${w||''}"><small>${l}</small>${esc(v||'—')}</div>`;
  $('slist').style.display = 'none'; $('sdet').style.display = 'block';
  $('sdet').innerHTML = `<div class="card"><b style="font-size:18px">${esc(r.name)}</b><span class="tag ${c}">Copa ${c}</span>
    <div style="font-size:13px;color:var(--t2);margin-top:4px">👨 ${esc(r.father)} · 📱 ${esc(r.mobile)}</div>
    <span class="tag" style="margin:8px 0 0;display:inline-block;background:${paid?'rgba(34,197,94,.2)':'rgba(239,68,68,.2)'};color:var(--${paid?'g':'r'})">${paid?'✓ Fees Paid':'✗ Fees Pending'}</span>
    <div class="d">${it('S.No.',r.sno)}${it('Reg. No.',r.reg)}${it('Gender',r.gender)}${it('Date of Birth',showDate(r.dob))}${it('Category',r.category)}${it('Merit %',r.merit)}${it('Admission',showDate(r.adm))}${it('Aadhaar',r.aadhaar)}${it('Address',r.address,'w')}</div></div>
    <button class="btn p" onclick="editHit(${k})">✏️ Edit karein</button>
    <button class="btn" onclick="renderSearch()">← Results par wapas</button>`;
}
function editHit(k){ const {c,i} = window._hits[k]; setCopa(c); loadEdit(i); }

function toast(m,t='ok'){ const e=$('toast'); e.textContent=m; e.className='show '+t; clearTimeout(toast.t); toast.t=setTimeout(()=>e.className='', 3000 + m.length*35); }

try { const k = JSON.parse(localStorage.getItem('copa_cache_v1') || 'null');
  if (k) ['B','C'].forEach(c => { if (k[c]){ data[c] = k[c].d || []; next[c] = k[c].n || {}; } }); } catch(e){}
setCopa('B'); tab(0); checkSetup(); loadAll();
// background auto-connect: har 20 sec me chup-chaap refresh + app wapas khulte hi refresh
setInterval(() => { if (!document.hidden) loadAll(true); }, 20000);
window.addEventListener('online', () => loadAll(true));
window.addEventListener('focus', () => loadAll(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(true); });
</script>
</body>
</html>
